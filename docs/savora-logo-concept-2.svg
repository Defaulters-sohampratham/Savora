<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" fill="none">
  <defs>
    <linearGradient id="aurora" x1="12" y1="10" x2="112" y2="117" gradientUnits="userSpaceOnUse">
      <stop stop-color="#99F6E4"/>
      <stop offset=".46" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="night-orbit" x1="16" y1="10" x2="109" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#164E63"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="soft-shadow" x="-18%" y="-18%" width="136%" height="146%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1400" height="820" fill="#F1F5F9"/>
  <text x="80" y="92" fill="#0F172A" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-1">SAVORA — CONCEPT 02</text>
  <text x="80" y="132" fill="#64748B" font-family="Arial, sans-serif" font-size="18">The living reserve</text>

  <!-- Light logo card -->
  <rect x="80" y="192" width="600" height="500" rx="32" fill="white" filter="url(#soft-shadow)"/>
  <text x="128" y="258" fill="#64748B" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">LIGHT MODE</text>
  <g transform="translate(128 325)">
    <!-- the outer coin/orbit --><circle cx="62" cy="62" r="61" fill="#0F172A"/>
    <circle cx="62" cy="62" r="48" stroke="#334155" stroke-width="1.5"/>
    <!-- dynamic reserve fields --><path d="M17 67.6c10.2-10.4 22.2-14.5 35.9-12.4 14.1 2.1 21.8 11.2 35 11.2 8.4 0 15.7-2.5 21.9-7.5" stroke="url(#aurora)" stroke-width="14" stroke-linecap="round"/>
    <path d="M20.7 44.2c10.1-8.6 21.5-11.6 34.4-9.2 14.4 2.7 21.6 11.4 34.1 11.4 8.5 0 15.9-2.4 22.3-7.3" stroke="#14B8A6" stroke-opacity=".42" stroke-width="5" stroke-linecap="round"/>
    <!-- an open upward S is readable as continuous cashflow --><path d="M25.8 84.4c8.4 8.7 18.2 12.9 29.5 12.9 13.4 0 23.6-5.7 30.5-17.2" stroke="#99F6E4" stroke-width="5" stroke-linecap="round"/>
    <circle cx="98.4" cy="30.3" r="5.4" fill="#CCFBF1"/>
  </g>
  <text x="275" y="405" fill="#0F172A" font-family="Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-5">Savora<tspan fill="#0D9488">.</tspan></text>
  <text x="130" y="528" fill="#475569" font-family="Arial, sans-serif" font-size="18">An S-shaped current, built from reserve layers.</text>
  <line x1="128" y1="574" x2="632" y2="574" stroke="#E2E8F0"/>
  <text x="128" y="620" fill="#64748B" font-family="Arial, sans-serif" font-size="16">It suggests adaptable cashflow without using a bank, shield, or graph cliché.</text>

  <!-- Dark logo card -->
  <rect x="720" y="192" width="600" height="500" rx="32" fill="#090E14" filter="url(#soft-shadow)"/>
  <text x="768" y="258" fill="#94A3B8" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">DARK MODE</text>
  <g transform="translate(768 325)">
    <circle cx="62" cy="62" r="61" fill="url(#night-orbit)" stroke="#155E75" stroke-width="1.5"/>
    <circle cx="62" cy="62" r="48" stroke="#164E63" stroke-width="1.5"/>
    <path d="M17 67.6c10.2-10.4 22.2-14.5 35.9-12.4 14.1 2.1 21.8 11.2 35 11.2 8.4 0 15.7-2.5 21.9-7.5" stroke="url(#aurora)" stroke-width="14" stroke-linecap="round"/>
    <path d="M20.7 44.2c10.1-8.6 21.5-11.6 34.4-9.2 14.4 2.7 21.6 11.4 34.1 11.4 8.5 0 15.9-2.4 22.3-7.3" stroke="#5EEAD4" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>
    <path d="M25.8 84.4c8.4 8.7 18.2 12.9 29.5 12.9 13.4 0 23.6-5.7 30.5-17.2" stroke="#CCFBF1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="98.4" cy="30.3" r="5.4" fill="#F0FDFA"/>
  </g>
  <text x="915" y="405" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-5">Savora<tspan fill="#2DD4BF">.</tspan></text>
  <text x="770" y="528" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18">The orbit gains a subtle nocturnal depth.</text>
  <line x1="768" y1="574" x2="1272" y2="574" stroke="#1E293B"/>
  <text x="768" y="620" fill="#94A3B8" font-family="Arial, sans-serif" font-size="16">One geometric mark, clear across both colour environments.</text>
</svg>
